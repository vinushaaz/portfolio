<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Portfolio CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="pcb-bg"></div>
<div class="grain"></div>

<div class="login-shell">
  <div class="login-card glass">
    <div class="brand" style="margin-bottom:22px;"><span class="dot"></span> ADMIN ACCESS</div>
    <h2 style="margin:0 0 6px;">Sign in</h2>
    <p class="card-desc" style="margin-bottom:26px;">Only the site owner can edit content. Everyone else sees the public portfolio.</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Sign in</button>
      <p id="loginError" class="card-desc" style="color:var(--danger); margin-top:14px; display:none;"></p>
    </form>
    <p class="card-desc" style="margin-top:22px; text-align:center;"><a href="index.html" style="color:var(--emerald-brt)">← Back to public portfolio</a></p>
  </div>
</div>

<div id="toast"></div>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
  // If already signed in, skip straight to the dashboard.
  sb.auth.getSession().then(({ data }) => { if (data.session) window.location.href = "admin.html"; });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const errEl = document.getElementById("loginError");
    errEl.style.display = "none";
    btn.disabled = true; btn.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    });
    btn.disabled = false; btn.textContent = "Sign in";
    if (error) { errEl.textContent = error.message; errEl.style.display = "block"; return; }
    window.location.href = "admin.html";
  });
</script>
</body>
</html>
